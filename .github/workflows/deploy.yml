name: Deploy Laravel to FTP server

on: workflow_dispatch

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Store secrets
        run: |
          mkdir storage/secrets
          echo "${{ secrets.DOTENV_PROD }}" > .env
          echo "${{ secrets.GAPI_SERVICE_ACCOUNT }}" > storage/secrets/service-account.json
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR }}
      - name: Install Composer packages
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          script: |
            cd ${{ vars.FTP_SERVER_DIR }}
            composer install --prefer-dist --no-progress
